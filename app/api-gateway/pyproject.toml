[project]
name = "sentinel-api-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# ".." reaches app/ so the shared `common.telemetry` module resolves in tests.
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100

# Pin the ruleset (ruff's original default) so lint is reproducible across ruff
# releases — newer ruff expands the default select. Same discipline as the other
# pinned tooling; adopt new rules deliberately, not on a version bump.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
